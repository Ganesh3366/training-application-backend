spring.application.name=training-application-backend

# --- Optional development/demo data ---
app.demo-data.enabled=${SEED_DEMO_DATA:false}

# --- Optional initial administrator ---
app.admin.name=${APP_ADMIN_NAME:}
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}

# --- Database connection ---
spring.datasource.url=jdbc:postgresql://localhost:5432/training_application
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- Server port (backend API) ---
server.port=8080
